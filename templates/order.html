{% extends 'base.html' %}

{% block content %}
    <h1>Order {{ drink }}</h1>
    <form method="post">
        <p>Price: ${{ price }}</p>
        <div>
            {% for coin, value in coins.items() %}
                <label>{{ coin }} ({{ value }} USD): <input type="number" name="{{ coin }}" min="0" step="1"></label>
                <br>
            {% endfor %}
        </div>
        <button type="submit">Submit Payment</button>
    </form>
{% endblock %}
